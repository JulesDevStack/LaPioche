services:
  backend:
    build:
      context: ./back
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    volumes:
      - ./data:/data
    restart: unless-stopped

  frontend:
    image: nginx:alpine
    ports:
      - "8080:80"
    volumes:
      - ./front:/usr/share/nginx/html:ro
    depends_on:
      - backend
    restart: unless-stopped
